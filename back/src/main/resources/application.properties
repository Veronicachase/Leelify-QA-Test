spring.application.name=leelify-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leelify_db?serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:refresh-sessions.sql
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.auth.refresh-seconds=604800
# Set true in production (HTTPS). Local development uses HTTP.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}

